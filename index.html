<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanLab - AI文本处理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #181c20;
      /* Slightly darker track */
    }

    ::-webkit-scrollbar-thumb {
      background: #4a5568;
      /* Darker thumb */
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }

    /* Custom Toggle Switch Styles */
    .toggle-switch-input {
      position: absolute;
      left: -9999px;
      /* Hide the default checkbox */
    }

    .toggle-switch-label {
      display: block;
      cursor: pointer;
      width: 44px;
      /* Width of the switch */
      height: 24px;
      /* Height of the switch */
      background-color: #4a5568;
      /* Grayish background for OFF state */
      border-radius: 9999px;
      /* Fully rounded */
      position: relative;
      transition: background-color 0.3s ease;
      flex-shrink: 0;
      /* Prevent it from shrinking */
    }

    .toggle-switch-label::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      /* Size of the thumb */
      height: 20px;
      /* Size of the thumb */
      background-color: #cbd5e0;
      /* Light gray thumb */
      border-radius: 9999px;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .toggle-switch-input:checked+.toggle-switch-label {
      background-color: #3b82f6;
      /* Blue background for ON state */
    }

    .toggle-switch-input:checked+.toggle-switch-label::after {
      transform: translateX(20px);
      /* Move thumb to the right */
      background-color: #e0e7ff;
      /* Lighter blue thumb for ON state */
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden selection:bg-blue-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
